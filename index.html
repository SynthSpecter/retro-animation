<!doctype html>
<html lang="fr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Synthverse, une anthologie animée synthwave des projets de SynthSpecter."
    />
    <meta name="theme-color" content="#080b14" />
    <title>Synthverse | Retro Animation</title>

    <!-- FR : Les styles sont locaux afin que l'animation fonctionne aussi hors ligne. -->
    <!-- EN: Styles are local so the animation also works offline. -->
    <link rel="stylesheet" href="styles/main.css" />
    <link rel="stylesheet" href="styles/animation.css" />
    <link rel="stylesheet" href="styles/effects.css" />

    <script>
      /*
       * FR : Le thème sauvegardé est appliqué avant l'affichage pour éviter un flash.
       * EN: The saved theme is applied before paint to prevent a visual flash.
       */
      try {
        const savedTheme = localStorage.getItem('retro-animation-theme')
        document.documentElement.dataset.theme =
          savedTheme === 'light' ? 'light' : 'dark'
      } catch {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
  </head>

  <body>
    <!-- FR : Ce lien permet aux utilisateurs du clavier d'atteindre directement l'animation. -->
    <!-- EN: This link lets keyboard users jump straight to the animation. -->
    <a class="skip-link" href="#animation-stage" data-i18n="skipToAnimation">
      Aller à l'animation
    </a>

    <main class="experience" id="app">
      <!-- FR : L'en-tête identifie l'œuvre et regroupe les réglages globaux. -->
      <!-- EN: The header identifies the piece and gathers global settings. -->
      <header class="topbar">
        <div class="brand-lockup" aria-label="Retro Animation">
          <span class="signal-mark" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
          </span>
          <div>
            <p class="brand-kicker">RETRO ANIMATION // 02</p>
            <h1>SYNTHVERSE</h1>
          </div>
        </div>

        <div class="topbar-actions" aria-label="Réglages" data-i18n-aria="settings">
          <button
            class="text-button"
            id="language-button"
            type="button"
            aria-label="Afficher en anglais"
            title="Afficher en anglais"
          >
            <span aria-hidden="true">FR</span>
            <span class="language-divider" aria-hidden="true">/</span>
            <strong id="language-target">EN</strong>
          </button>

          <button
            class="icon-button"
            id="theme-button"
            type="button"
            aria-label="Activer le thème clair"
            title="Activer le thème clair"
          >
            <span id="theme-icon" aria-hidden="true">◐</span>
          </button>

          <button
            class="icon-button"
            id="fullscreen-button"
            type="button"
            aria-label="Plein écran"
            title="Plein écran"
          >
            <span aria-hidden="true">⛶</span>
          </button>
        </div>
      </header>

      <!-- FR : Le canvas 16:9 contient le film ; le HUD reste lisible au-dessus. -->
      <!-- EN: The 16:9 canvas holds the film; the HUD remains readable above it. -->
      <section
        class="stage-shell"
        id="animation-stage"
        aria-labelledby="scene-title"
      >
        <canvas
          id="synth-canvas"
          width="1600"
          height="900"
          role="img"
          tabindex="0"
          aria-label="Animation Synthverse"
          data-i18n-aria="canvasLabel"
        >
          Votre navigateur ne prend pas en charge Canvas. Your browser does not
          support Canvas.
        </canvas>

        <div class="stage-effects" aria-hidden="true">
          <span class="scanlines"></span>
          <span class="screen-vignette"></span>
          <span class="noise-layer"></span>
        </div>

        <div class="stage-hud" aria-hidden="true">
          <div class="scene-identity">
            <p class="scene-index" id="scene-index">01 / 13</p>
            <p class="scene-project" id="scene-project">RETRO ANIMATION</p>
            <h2 id="scene-title">Initialisation</h2>
          </div>

          <div class="signal-readout">
            <span class="signal-light"></span>
            <span data-i18n="liveSignal">SIGNAL ACTIF</span>
          </div>
        </div>

        <p class="scene-caption" id="scene-caption" aria-hidden="true">
          Quatorze projets. Un même horizon.
        </p>
      </section>

      <!-- FR : Le transport contrôle l'œuvre sans transformer l'écran en éditeur. -->
      <!-- EN: The transport controls the piece without turning the screen into an editor. -->
      <footer class="transport">
        <div class="transport-buttons" role="group" aria-label="Lecture" data-i18n-aria="playback">
          <button
            class="icon-button transport-button"
            id="restart-button"
            type="button"
            aria-label="Recommencer"
            title="Recommencer"
          >
            <span aria-hidden="true">↺</span>
          </button>

          <button
            class="icon-button transport-button"
            id="previous-button"
            type="button"
            aria-label="Chapitre précédent"
            title="Chapitre précédent"
          >
            <span aria-hidden="true">◀</span>
          </button>

          <button
            class="play-button"
            id="play-button"
            type="button"
            aria-label="Mettre en pause"
            title="Mettre en pause"
          >
            <span id="play-icon" aria-hidden="true">Ⅱ</span>
          </button>

          <button
            class="icon-button transport-button"
            id="next-button"
            type="button"
            aria-label="Chapitre suivant"
            title="Chapitre suivant"
          >
            <span aria-hidden="true">▶</span>
          </button>

          <button
            class="icon-button transport-button"
            id="sound-button"
            type="button"
            aria-pressed="false"
            aria-label="Activer le son"
            title="Activer le son"
          >
            <span id="sound-icon" aria-hidden="true">♪</span>
          </button>

          <button
            class="icon-button transport-button"
            id="snapshot-button"
            type="button"
            aria-label="Capturer l'image"
            title="Capturer l'image"
          >
            <span aria-hidden="true">▣</span>
          </button>
        </div>

        <div class="timeline-panel">
          <label class="visually-hidden" for="timeline" data-i18n="timelineLabel">
            Position dans l'animation
          </label>
          <div class="timeline-track">
            <input
              id="timeline"
              type="range"
              min="0"
              max="1000"
              step="1"
              value="0"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="0"
            />
            <div class="chapter-markers" id="chapter-markers"></div>
          </div>
          <div class="time-row" aria-hidden="true">
            <span id="elapsed-time">00:00</span>
            <span class="now-playing" id="now-playing">RETRO ANIMATION</span>
            <span id="total-time">01:09</span>
          </div>
        </div>
      </footer>

      <!-- FR : Les changements importants sont annoncés aux lecteurs d'écran. -->
      <!-- EN: Important changes are announced to screen readers. -->
      <p class="visually-hidden" id="live-region" aria-live="polite"></p>
    </main>

    <noscript>
      Cette animation nécessite JavaScript. This animation requires JavaScript.
    </noscript>

    <!-- FR : Les scripts classiques gardent le projet compatible avec une ouverture directe. -->
    <!-- EN: Classic scripts keep the project compatible with direct file opening. -->
    <script src="scripts/translations.js"></script>
    <script src="scripts/theme.js"></script>
    <script src="scripts/effects.js"></script>
    <script src="scripts/sprites.js"></script>
    <script src="scripts/canvas.js"></script>
    <script src="scripts/animation.js"></script>
    <script src="scripts/audio.js"></script>
    <script src="scripts/exporter.js"></script>
    <script src="scripts/app.js"></script>
  </body>
</html>
